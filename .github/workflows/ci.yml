name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - run: cargo check --workspace --all-targets --locked

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Online runs: fresh advisory data. The Deliver gate repeats these offline.
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  # The single source of truth: the same cumulative gate kaptaind enforces locally.
  deliver:
    runs-on: ubuntu-latest
    needs: [lint, test, msrv, supply-chain]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked --git https://github.com/elci-group/deliver deliver
      - run: cargo install --locked cargo-deny cargo-audit
      - run: cargo audit   # populates the advisory DB the offline gate reads
      - name: Deliver gate (SARIF)
        run: deliver --spec deliver.toml --strict --format sarif > deliver.sarif
      - name: Deliver gate (human-readable)
        if: always()
        run: deliver --spec deliver.toml --format text --color never
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: deliver.sarif
          category: deliver
