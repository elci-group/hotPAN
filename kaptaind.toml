# kaptaind configuration — auto-generated by `kaptaind-cli init`

# Observe-only by default: the daemon scores every change and records the
# decision to .kaptaind/decisions.jsonl, but never stages, commits, writes
# VERSION, pushes, or ships. Uncomment to let it actually commit — pushing
# additionally needs [push] enabled = true and
# [capabilities] network_push = true below.
[operation]
mode = "actuate"

[watch]
path = "."
recursive = true
ignore_file = ".kaptainignore"

[cluster]
window = 5
# max_paths = 0      # flush cluster after N events (0 = disabled)
# flush_after = 10   # idle timeout in seconds (defaults to window)

[weights]
s = 0.35
a = 0.30
d = 0.20
r = 0.15

[version_thresholds]
minor = 0.6    # score at or above this bumps Minor
# 0.0 (matching the sibling `bart` project's proven-working config): a
# config/doc-only change scoring near-zero still gets a real Patch bump
# and commit rather than falling into the "chore_commit" path, which
# this session confirmed never triggers `[push]` even with it enabled.
patch = 0.0

[push]
enabled = true
branch = "master"

# kaptaind refuses to push a branch named main/master by default
# ("push to protected branch 'master' is disabled by configuration").
# Overriding that here to an empty list is the same override the
# sibling `padagonia`/`ingauge` projects use, and is exactly what
# pushing this branch to origin requires.
[push.safety]
protect_branches = []

[capabilities]
network_push = true

[ratelimit]
min_commit_interval = 10

# Copied from the sibling kami project's working config.
[trust]
execution = "trusted"

[test]
command = "cargo test"
required = true

[staging]
# "cluster" (fs-watch observed changes only) requires a long-running daemon
# alongside every edit; this session instead runs `kaptaind` in short
# foreground bursts after each batch of changes, so "all" (git add -A) is
# used deliberately here — this is a single-developer, non-shared checkout,
# and kaptaind still aborts on secret-pattern files.
mode = "all"
# include = ["src/**"] # only used in "pattern" mode
# exclude = ["*.log", ".env*"]

