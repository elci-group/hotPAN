# cargo-deny policy for hotPAN. Run: `cargo deny check`.
# Part of the Phase 0 gate (deliver/phase-0.toml); CI runs it too.

[graph]
all-features = false

[advisories]
# Any advisory fails the build. Add an ignore only with a dated reason.
ignore = []

[licenses]
# Every licence actually present in the dependency graph when this policy
# was written (all permissive). A new dependency bringing in anything else
# must fail here and be reviewed, so do not copy in a template list.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Workspace path dependencies use `workspace = true`; never allow `*` from crates.io.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
