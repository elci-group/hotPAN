[package]
name = "hotpan-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt", "io-util"] }
hotpan-core = { path = "../crates/hotpan-core" }
hotpan-wire = { path = "../crates/hotpan-wire" }

# Not part of the main workspace: built only by `cargo +nightly fuzz`.
[workspace]
members = ["."]

[[bin]]
name = "wire_messages"
path = "fuzz_targets/wire_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "job_spec"
path = "fuzz_targets/job_spec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
doc = false
bench = false
